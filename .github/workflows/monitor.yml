name: Internship Sentinel

on:
  schedule:
    # Every 5 minutes. Note: GitHub's shortest cron interval is 5 minutes,
    # and scheduled runs can be delayed under load.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Manual trigger for testing.
    inputs:
      dry_run:
        description: "Scrape & match without sending alerts"
        type: boolean
        default: false

permissions:
  contents: write  # allow committing updated state back to the repo

concurrency:
  # Prevent overlapping runs from racing on the state file.
  group: internship-sentinel
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m sentinel.main --config config/config.json --dry-run
          else
            python -m sentinel.main --config config/config.json
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/state.json; then
            git add data/state.json
            git commit -m "chore: update seen-job state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
