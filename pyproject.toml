[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-sentinel"
version = "0.1.0"
description = "Modular internship job monitor with instant alerts."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make the `sentinel` package importable from the src/ layout without install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
